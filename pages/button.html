<section id="button" class="section">
  <h2>Button</h2>
  <p class="section-meta">Displays a button or a component that looks like a button.</p>

  <h3>Variants</h3>
  <preview style="flex-wrap: wrap; gap: 0.75rem">
    <button class="btn">Default</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-destructive">Destructive</button>
    <button class="btn btn-outline">Outline</button>
    <button class="btn btn-ghost">Ghost</button>
    <button class="btn btn-link">Link</button>
  </preview>

  <h3>Sizes</h3>
  <preview style="flex-wrap: wrap; gap: 0.75rem">
    <button class="btn btn-xs">Extra Small</button>
    <button class="btn btn-sm">Small</button>
    <button class="btn">Default</button>
    <button class="btn btn-lg">Large</button>
    <button class="btn btn-xl">Extra Large</button>
  </preview>

  <h3>States</h3>
  <preview style="flex-wrap: wrap; gap: 0.75rem; align-items: center">
    <button class="btn" disabled>Disabled</button>
    <button class="btn btn-outline btn-icon" aria-label="Magic">
      <i data-lucide="wand-2"></i>
    </button>
    <button class="btn">
      <i data-lucide="send"></i>
      Send Message
    </button>
    <button class="btn" disabled>
      <div class="spinner"></div>
      Please wait
    </button>
    <div style="display: flex; align-items: center; gap: 0.375rem">
      <button class="btn btn-outline btn-icon-xs" aria-label="xs">
        <i data-lucide="settings"></i>
      </button>
      <button class="btn btn-outline btn-icon-sm" aria-label="sm">
        <i data-lucide="settings"></i>
      </button>
      <button class="btn btn-outline btn-icon" aria-label="md">
        <i data-lucide="settings"></i>
      </button>
      <button class="btn btn-outline btn-icon-lg" aria-label="lg">
        <i data-lucide="settings"></i>
      </button>
      <button class="btn btn-outline btn-icon-xl" aria-label="xl">
        <i data-lucide="settings"></i>
      </button>
    </div>
  </preview>
</section>
