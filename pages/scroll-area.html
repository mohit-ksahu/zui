<section id="scroll-area" class="section">
  <h2>Scroll Area</h2>
  <p class="section-meta">
    Augments native scroll functionality for custom, cross-browser styling.
  </p>

  <!-- Vertical -->
  <h3>Vertical</h3>
  <preview>
    <div class="scroll-area scroll-area-vertical" style="height: 12rem; width: 18rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.75rem">
      <div style="display: flex; flex-direction: column; gap: 0.5rem">
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.0.0-beta</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.1.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.2.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.3.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.4.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.5.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.6.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem; border-bottom: 1px solid var(--border)">v1.7.0</div>
        <div style="padding: 0.375rem 0; font-size: 0.8125rem">v2.0.0</div>
      </div>
    </div>
  </preview>

  <!-- Horizontal -->
  <h3>Horizontal</h3>
  <preview>
    <div class="scroll-area scroll-area-horizontal" style="width: 22rem; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 0.75rem">
      <div style="display: flex; gap: 0.75rem">
        <div style="width: 8rem; height: 10rem; flex-shrink: 0; background-color: var(--muted); border-radius: var(--radius-md); border: 1px solid var(--border)"></div>
        <div style="width: 8rem; height: 10rem; flex-shrink: 0; background-color: var(--muted); border-radius: var(--radius-md); border: 1px solid var(--border)"></div>
        <div style="width: 8rem; height: 10rem; flex-shrink: 0; background-color: var(--muted); border-radius: var(--radius-md); border: 1px solid var(--border)"></div>
        <div style="width: 8rem; height: 10rem; flex-shrink: 0; background-color: var(--muted); border-radius: var(--radius-md); border: 1px solid var(--border)"></div>
        <div style="width: 8rem; height: 10rem; flex-shrink: 0; background-color: var(--muted); border-radius: var(--radius-md); border: 1px solid var(--border)"></div>
      </div>
    </div>
  </preview>
</section>
