<section id="avatar" class="section">
  <h2>Avatar</h2>
  <p class="section-meta">A component for representing the user with a fallback.</p>

  <!-- 1. Basic -->
  <preview>
    <span class="avatar">
      <img
        src="https://i.pravatar.cc/150?u=cloud"
        alt="Alex"
        width="150"
        height="150"
        loading="lazy"
        class="avatar-image"
      />
      <span class="avatar-fallback">AL</span>
    </span>
  </preview>

  <!-- 2. Badge -->
  <h3>Status Badge</h3>
  <preview>
    <span class="avatar">
      <img
        src="https://i.pravatar.cc/150?u=cloud"
        alt="Elena"
        width="150"
        height="150"
        loading="lazy"
        class="avatar-image"
      />
      <span class="avatar-fallback">EL</span>
      <span class="avatar-badge" style="background-color: var(--success, #10b981)"></span>
    </span>
    <span class="avatar">
      <img
        src="https://i.pravatar.cc/150?u=devops"
        alt="Marcus"
        width="150"
        height="150"
        loading="lazy"
        class="avatar-image"
      />
      <span class="avatar-fallback">MA</span>
      <span class="avatar-badge" style="background-color: var(--warning, #f59e0b)"></span>
    </span>
    <span class="avatar">
      <span class="avatar-fallback">SR</span>
      <span class="avatar-badge" style="background-color: var(--destructive, #ef4444)"></span>
    </span>
  </preview>

  <!-- 4. Avatar Group -->
  <h3>Avatar Group</h3>
  <preview>
    <div class="avatar-group">
      <span class="avatar">
        <img
          src="https://i.pravatar.cc/150?u=a042581f4e29026704d"

          height="150"

        />
        <span class="avatar-fallback">SO</span>

      <span class="avatar">
        <img
          src="https://i.pravatar.cc/150?u=a04258a2462d826712d"
          alt="Elena"
          width="150"
          height="150"
          loading="lazy"
          class="avatar-image"
        />
        <span class="avatar-fallback">EL</span>
      </span>
      <span class="avatar">
        <img
          src="https://i.pravatar.cc/150?u=a042581f4e29026024d"
          alt="Marcus"
          width="150"
          height="150"
          loading="lazy"
          class="avatar-image"
        />
        <span class="avatar-fallback">MA</span>
      </span>
      <span class="avatar">
        <span class="avatar-fallback">OP</span>
      </span>
    </div>
  </preview>

  <!-- 5. Avatar Group Count -->
  <h3>Avatar Group Count</h3>

    <div class="avatar-group">
      <span class="avatar">

    <div class="avatar-group">
